# Servidores MCP de Tama. Se lanzan por stdio como subprocesos al iniciar.
# "python" se reemplaza por el Python del entorno de Tama: nada de npx ni descargas al arrancar.
# Por turno se ven pocas (TAMA_TOOLS_MAX): "siempre", lo usado en el turno anterior y "base".
# Si un servidor no indica "base", todas las suyas lo son. El resto se pide con abrir_herramientas.

[servidores.tiempo]
comando = ["python", "-m", "mcp_server_time", "--local-timezone", "America/Santiago"]
# Solo la hora actual; la conversión entre zonas casi no se usa y ocupa espacio en el prompt.
herramientas = ["get_current_time"]
siempre = ["get_current_time"]

[servidores.tiempo.descripciones]
get_current_time = "Da la fecha y la hora actuales (zona America/Santiago). Úsala cada vez que las necesites: nunca las supongas. Para guardar algo con fecha relativa (\"hace tres días\") no hace falta: create_entities la calcula."

[servidores.memoria]
comando = ["python", "-m", "tama.mcp_servers.memoria"]
# Fuera de la vista del modelo: borrar entidades o relaciones y todo lo de /olvidar.
herramientas = [
    "search_nodes", "create_entities", "add_observations", "linea_de_tiempo",
    "update_observation", "delete_observations", "recent_events", "proponer_cambio_perfil",
    "manage_goals", "discard_goal", "list_suggestions",
    "crear_recordatorio", "list_reminders", "update_reminder", "cancel_reminder", "rename_entity",
]
siempre = ["search_nodes", "create_entities"]
base = [
    "update_observation", "linea_de_tiempo", "manage_goals", "list_suggestions",
    "crear_recordatorio",
]

[servidores.notas]
comando = ["python", "-m", "tama.mcp_servers.notas"]

[servidores.archivos]
comando = ["python", "-m", "tama.mcp_servers.archivos"]

[servidores.web]
comando = ["python", "-m", "tama.mcp_servers.web"]
requiere_red = true

[servidores.web.descripciones]
fetch = "Lee una página web a partir de su URL. Úsala siempre que Renzo dé una URL o pida revisar una página: no respondas sin leerla."
