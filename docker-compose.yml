# Tama en un contenedor; Ollama corre nativo en el host (Windows, Linux o macOS).
#   docker compose build              # una vez, con internet
#   docker compose run --rm tama "hola"
#   docker compose up -d                 # web en http://127.0.0.1:8765
#   docker compose --profile ntfy up -d  # además, avisos al celular por el WiFi

services:
  tama:
    build: .
    command: ["web"]
    image: tama:0.1.0
    container_name: tama
    # Claves y ajustes desde .env (opcional: sin él, Tama responde solo en local).
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      TAMA_LOCAL_MODEL: ${TAMA_LOCAL_MODEL:-qwen3:4b-instruct-2507-q8_0}
      TAMA_THINK: ${TAMA_THINK:-false}
      TAMA_WEB_HOST: 0.0.0.0
      TAMA_WEB_PORT: ${TAMA_WEB_PORT:-8765}
      TAMA_VOICE_MODELS_DIR: /modelos/voz
    # En Linux host.docker.internal no existe por defecto.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - tama-data:/data
      # Perfil (nucleo.md) y export del grafo: datos personales, solo en este volumen.
      - tama-memoria:/memoria
      # Carpeta de trabajo para el servidor de archivos: la de Renzo en el host.
      - ${TAMA_WORKDIR_HOST:-./trabajo}:/trabajo
      # Modelos de voz (whisper y Piper), descargados en el host con scripts/descargar_voz.py.
      - ./models/voz:/modelos/voz:ro
    # Solo en localhost: Tama no queda a la vista de la red. Se abre con `docker compose run
    # --service-ports tama web`. Dentro del contenedor debe escuchar en todas sus interfaces.
    ports:
      - "127.0.0.1:${TAMA_WEB_PORT:-8765}:${TAMA_WEB_PORT:-8765}"
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tama", "--check"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3

  # Avisos al celular con un servidor propio: el texto nunca pasa por ntfy.sh. El teléfono se
  # suscribe por el mismo WiFi (sin internet) o, fuera de la casa, por Tailscale (`tama celular`).
  ntfy:
    profiles: ["ntfy"]
    image: binwiederhier/ntfy:v2.11.0
    command: ["serve"]
    environment:
      # La dirección que usa el celular (https://<pc>.ts.net:8443 con `tailscale serve`).
      NTFY_BASE_URL: ${TAMA_NTFY_PUBLIC_URL:-}
      NTFY_BEHIND_PROXY: "true"
      # Solo para iPhone: https://ntfy.sh despierta la app con un identificador, nunca el texto.
      NTFY_UPSTREAM_BASE_URL: ${TAMA_NTFY_UPSTREAM:-}
    ports:
      - "${TAMA_NTFY_PORT:-8090}:80"
    volumes:
      - tama-ntfy:/var/cache/ntfy
    restart: unless-stopped

volumes:
  tama-ntfy:
  tama-data:
  tama-memoria:
