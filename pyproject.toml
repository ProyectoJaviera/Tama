[project]
name = "tama"
version = "0.1.0"
description = "Tama: asistente de IA personal y acompañante diario, 100% funcional sin internet."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3,<3",
    "httpx>=0.28,<0.29",
    "mcp>=2.3,<3",
    "mcp-server-fetch==2026.10.28",
    "mcp-server-time==2026.10.28",
    "psutil>=6.1,<8",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "truststore>=0.10,<1",
    "webauthn==2.7.0",
]

[project.scripts]
tama = "tama.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.49,<2",
    "pytest>=8.3",
    "ruff>=0.9",
]
bench = [
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tama"]

[tool.uv]
default-groups = ["dev", "bench"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
