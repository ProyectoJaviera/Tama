{% extends "base.html" %}
{% block body %}
<div id="preparando" hx-get="/preparando" hx-trigger="load" hx-swap="outerHTML"></div>
<div id="log">
  {% for kind, text in history %}
  {% if kind == "choices" %}
  <div class="row choices">{% for c in text %}<button type="button" class="plain" data-command="{{ c.command }}">{{ c.label }}</button>{% endfor %}</div>
  {% else %}
  <div class="{{ kind }}">{{ text }}</div>
  {% endif %}
  {% endfor %}
</div>
<form id="chat-form" class="row">
  <input id="chat-text" name="text" list="comandos" autocomplete="off" autofocus placeholder="Escríbele a Tama, o /ayuda para ver los comandos" aria-label="Mensaje">
  <button type="submit">Enviar</button>
</form>
<datalist id="comandos">
  {% for name, what in commands.items() %}<option value="{{ name }}">{{ what }}</option>{% endfor %}
</datalist>
<dialog id="confirm">
  <p id="confirm-text"></p>
  <form method="dialog" class="row">
    <button id="confirm-yes" type="button">Sí</button>
    <button id="confirm-no" type="button" class="plain">No</button>
  </form>
</dialog>
{% endblock %}
{% block scripts %}<script src="/static/app.js?v={{ v }}"></script>{% endblock %}
