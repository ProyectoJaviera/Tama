{% extends "base.html" %}
{% block body %}
<div id="log">
  {% for type, text in history %}
  <div class="{{ 'user' if type == 'user_msg' else 'assistant' }}">{{ text }}</div>
  {% endfor %}
</div>
<form id="chat-form" class="row">
  <input id="chat-text" name="text" list="comandos" autocomplete="off" autofocus placeholder="Escríbele a Tama, o /ayuda para ver los comandos" aria-label="Mensaje">
  <button type="submit">Enviar</button>
</form>
<datalist id="comandos">
  {% for name, what in commands.items() %}<option value="{{ name }}">{{ what }}</option>{% endfor %}
</datalist>
<dialog id="confirm">
  <p id="confirm-text"></p>
  <form method="dialog" class="row">
    <button id="confirm-yes" type="button">Sí</button>
    <button id="confirm-no" type="button" class="plain">No</button>
  </form>
</dialog>
{% endblock %}
{% block scripts %}<script src="/static/app.js"></script>{% endblock %}
